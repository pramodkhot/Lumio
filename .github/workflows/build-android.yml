name: Build Android

on:
  push:
    branches: [main, 'release/*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: gradle assembleDebug --no-daemon

      - name: Generate Keystore for Release
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          keytool -genkeypair \
            -alias lumio-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore lumio-release.jks \
            -storepass lumio2024 \
            -keypass lumio2024 \
            -dname "CN=Lumio, OU=Games, O=Lumio, L=IN, ST=IN, C=IN"
          echo "✅ Keystore generated"

      - name: Build Signed Release AAB
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          gradle bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/lumio-release.jks \
            -Pandroid.injected.signing.store.password=lumio2024 \
            -Pandroid.injected.signing.key.alias=lumio-key \
            -Pandroid.injected.signing.key.password=lumio2024 \
            --no-daemon

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: lumio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Signed Release AAB
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: lumio-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
