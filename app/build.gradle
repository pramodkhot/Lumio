plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.lumio.gamezone'
    compileSdk 34

    defaultConfig {
        applicationId "com.lumio.gamezone"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Facebook App ID accessible in code
        resValue "string", "facebook_app_id", "1302824574544461"
        resValue "string", "fb_login_protocol_scheme", "fb1302824574544461"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Facebook Audience Network SDK v6.21 (latest)
    implementation 'com.facebook.android:audience-network-sdk:6.17.0'
}
